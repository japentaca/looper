# Looper — server block de nginx para looper.jape.com.ar
#
# Plantilla versionada. En el VPS se copia a /etc/nginx/conf.d/looper.jape.com.ar.conf (un archivo
# por sitio, como los demás; 00-default.conf ya corta los Host desconocidos). Antes de recargar:
# `nginx -t` y después `systemctl reload nginx`. Ver docs/DEPLOY.md.
#
# Supuestos (se confirman en la puesta en marcha, tarea 6.5 del plan):
# - Clon del repo en /var/lib/looper/looper (usuario de sistema `looper`, home /var/lib/looper).
#   nginx (www-data) tiene que poder atravesar /var/lib/looper y /var/lib/looper/looper (permiso x
#   para "otros") y leer frontend/dist.
# - Backend Node en 127.0.0.1:31200 (`service_port` de backend/.env). Si se cambia, cambiar los dos
#   proxy_pass de abajo.
# - La IP real del visitante ya la resuelve conf.d/cloudflare-realip.conf (real_ip con los rangos
#   de Cloudflare y CF-Connecting-IP): acá $remote_addr ya es la IP real. No duplicarlo.
# - Sin caché de Cloudflare: el audio y el frontend salen siempre de este servidor.

# HTTP → HTTPS. Con SSL "Full" en Cloudflare, una visita por http llega al origen por el puerto 80:
# se redirige. Si los otros sitios del servidor no tienen este bloque (p. ej. porque Cloudflare
# ya fuerza HTTPS), se puede quitar sin afectar el resto.
server {
  listen 80;
  listen [::]:80;
  server_name looper.jape.com.ar;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name looper.jape.com.ar;

  # Certificado de origen de Cloudflare (el mismo que usa jape.com.ar; tiene que cubrir
  # *.jape.com.ar). PLACEHOLDER: los nombres de archivo se confirman en la 6.5 copiando las dos
  # líneas ssl_certificate* del server block de jape.com.ar. Protocolos y cifrados: los globales
  # de nginx.conf.
  ssl_certificate     /opt/cert/cloudflare-origin.pem;
  ssl_certificate_key /opt/cert/cloudflare-origin.key;

  server_tokens off;

  # Headers de seguridad. `always` para que salgan también en errores (4xx/5xx) y en las
  # respuestas de la API. Ojo: un add_header dentro de un location reemplaza TODOS los de acá; por
  # eso las cachés de abajo se ponen con `expires`, que no usa add_header.
  # Sin embebido en iframes de otros sitios (decisión del plan).
  add_header X-Content-Type-Options "nosniff" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Requests normales (JSON): límite chico. La subida de audio tiene su propio location.
  client_max_body_size 1m;

  # Proxy a Node: se heredan en los location de /api (ninguno define proxy_set_header propio).
  # Express confía en el proxy de loopback (`trust proxy`): req.ip sale de X-Forwarded-For y la
  # cookie de sesión se marca Secure por X-Forwarded-Proto.
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Frontend: build de Vite (`npm run build_prd`).
  root /var/lib/looper/looper/frontend/dist;
  index index.html;

  # Rutas de vue-router (/p/<id>, /gallery, /admin...) con historial HTML5: si no es un archivo
  # del build, se devuelve index.html. /api tiene su propio location (gana el prefijo más largo),
  # así que un 404 de la API nunca cae acá.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html sin caché (Cache-Control: no-cache): siempre se revalida, así un despliegue nuevo
  # se ve al recargar. Cubre también el fallback de try_files y el índice de "/".
  location = /index.html {
    expires -1;
  }

  # Assets de Vite: el nombre lleva hash del contenido, se pueden cachear un año. Un asset que no
  # existe da 404 (no index.html).
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    access_log off;
  }

  # API. La caché larga de /api/file/:id (audio, immutable) la pone Express: acá no se toca.
  location /api/ {
    proxy_pass http://127.0.0.1:31200;
  }

  # Subida de audio: el límite de la app es 80 MB por archivo (UPLOAD_MAX_MB en
  # backend/routes/api.js y MAX_UPLOAD_MB en Uploader.vue); 90m deja margen para el multipart.
  # Cambiarlos juntos. nginx guarda el cuerpo entero antes de pasarlo a Node (proxy_request_buffering
  # por defecto), y la respuesta llega recién después de la conversión a MP3, que espera en una
  # cola de concurrencia 1: timeouts largos. Cloudflare, igual, corta a los 100 s sin respuesta
  # (error 524) y no deja pasar cuerpos de más de 100 MB.
  location = /api/upload {
    client_max_body_size 90m;
    client_body_timeout 120s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_pass http://127.0.0.1:31200;
  }
}
